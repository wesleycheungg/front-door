name: Update Linux Snapshots (temp)

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test visual --update-snapshots || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/visual.spec.js-snapshots/*-linux.png
